name: cuda-samples # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '13.2' # just for humans, typically '1.2+git' or '1.3.2'
summary: Cuda sample applications provided by nvidia # 79 char long summary
description: |
  This snap packages the cuda sample applications in order to test the
  behaviour of the GPU

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

package-repositories:
  - type: apt
    path: /
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/som
    architectures: [arm64]
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/common
    architectures: [arm64]

plugs:
  hardware-observe:
  opengl:
  network-bind:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
  tensorrt-libs-cuda-13:
    interface: content
    target: $SNAP/tensorrt-libs


apps:
  cuda-samples:
    command-chain:
      - bin/gpu-2404-wrapper
      - bin/tensorrt-libs-wrapper
    command: bin/execute_from_target_dir.sh

  all:
    command-chain:
      - bin/gpu-2404-wrapper
      - bin/tensorrt-libs-wrapper
    command: bin/execute_all.sh

layout:
  # the path of libcudadevrt.a is determined at build time
  /usr/local/cuda-13.2/lib64/libcudadevrt.a:
    symlink: $SNAP/tensorrt-libs/usr/local/cuda-13.2/targets/sbsa-linux/lib/libcudadevrt.a
  # the path of libdevice.10.bc is determined at build time
  /usr/local/cuda-13.2/nvvm/libdevice/libdevice.10.bc:
    symlink: $SNAP/tensorrt-libs/usr/local/cuda-13.2/nvvm/libdevice/libdevice.10.bc

parts:
  cuda-samples:
    plugin: nil
    build-packages:
      - initramfs-tools
      - cuda-13-2
      - cmake
    stage-packages:
      - libgomp1
    source: https://github.com/NVIDIA/cuda-samples.git
    source-type: git
    source-tag: v13.2
    override-build: |
      set -x

      mkdir -p /opt/nvidia/l4t-packages/
      touch /opt/nvidia/l4t-packages/.nv-l4t-disable-boot-fw-update-in-preinstall
      L4T_DEB_PACKAGES_PATH=${L4T_DEB_PACKAGES_PATH:="NVIDIA_ARCHIVE"}
      if [ "$L4T_DEB_PACKAGES_PATH" = "NVIDIA_ARCHIVE" ]; then
        apt update
        apt install --yes nvidia-l4t-core nvidia-l4t-cuda
      elif [ -d $L4T_DEB_PACKAGES_PATH ]; then
        apt install --yes libegl1 -f
        dpkg -i $L4T_DEB_PACKAGES_PATH/nvidia-l4t-core_*.deb
        dpkg -i $L4T_DEB_PACKAGES_PATH/nvidia-l4t-cuda_*.deb
      fi

      echo '/usr/local/cuda-13.2/compat' | tee -a /etc/ld.so.conf.d/000_cuda.conf
      ldconfig
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/opt/cuda-samples

      # change shared memory slab name to one we can access in the snap env
      sed -i "s/\(memmap_ipc_shm\)/snap\.cuda-samples\.\1/" Samples/3_CUDA_Features/memMapIPCDrv/memMapIpc.cpp

      cmake -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=native .
      make -j4 -C $CRAFT_PART_BUILD/
      cp -ar $CRAFT_PART_BUILD/Samples $CRAFT_PART_BUILD/Common $CRAFT_PART_INSTALL/opt/cuda-samples
      cd $CRAFT_PART_INSTALL/opt
      mkdir $CRAFT_PART_INSTALL/etc
      for f in $(find ./cuda-samples/Samples -executable -type f | grep -v "\.[A-Za-z]*$")
      do
        # exclude samples that are not supported on single GPUs
        EXCLUDED="simpleCUFFT_MGPU simpleCUFFT_2d_MGPU conjugateGradientMultiDeviceCG cudaCompressibleMemory streamOrderedAllocationP2P"
        if echo $EXCLUDED | grep -w -q "$(basename $f)"; then
          continue
        fi

        ln -sf /var/snap/cuda-samples/current/$f $CRAFT_PART_INSTALL/usr/bin/$(basename $f)
        echo $(basename $f) >> $CRAFT_PART_INSTALL/etc/cuda-samples.list
      done


  scripts:
    plugin: dump
    source: scripts
