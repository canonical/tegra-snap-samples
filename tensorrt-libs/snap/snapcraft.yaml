name: tensorrt-libs # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '10.16.2.10-1+cuda13.2' # just for humans, typically '1.2+git' or '1.3.2'
summary: TensorRT and cuda runtime libraries # 79 char long summary
description: |
  This snap contains the TensorRT runtime libraries contained in the deb
  packages libnvinfer-bin and libnvinfer-samples from nvidia's repositories
  as well as the cuda libraries contained in the cuda-12-6 package and its
  dependencies.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

package-repositories:
  - type: apt
    path: /
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/som
    architectures: [arm64]
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/common
    architectures: [arm64]

parts:
  cuda-libs:
    plugin: nil
    stage-packages:
      - cuda-13-2

  tensorrt-libs:
    plugin: nil
    stage-packages:
      - tensorrt=10.16.2.10-1+cuda13.2
      - libnvinfer10=10.16.2.10-1+cuda13.2
      - libnvinfer-plugin10=10.16.2.10-1+cuda13.2
      - libnvinfer-vc-plugin10=10.16.2.10-1+cuda13.2
      - libnvinfer-lean10=10.16.2.10-1+cuda13.2
      - libnvinfer-dispatch10=10.16.2.10-1+cuda13.2
      - libnvonnxparsers10=10.16.2.10-1+cuda13.2
      - libnvinfer-bin=10.16.2.10-1+cuda13.2
      - libnvinfer-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-lean-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-plugin-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-vc-plugin-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-dispatch-dev=10.16.2.10-1+cuda13.2
      - libnvonnxparsers-dev=10.16.2.10-1+cuda13.2
      - python3-libnvinfer-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-headers-python-plugin-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-headers-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-safe-headers-dev=10.16.2.10-1+cuda13.2
      - libnvinfer-headers-plugin-dev=10.16.2.10-1+cuda13.2
      - python3-libnvinfer=10.16.2.10-1+cuda13.2
      - python3-libnvinfer-lean=10.16.2.10-1+cuda13.2
      - python3-libnvinfer-dispatch=10.16.2.10-1+cuda13.2

  scripts:
    plugin: dump
    source: scripts

slots:
  tensorrt-libs-cuda-13:
    interface: content
    read:
      - /
