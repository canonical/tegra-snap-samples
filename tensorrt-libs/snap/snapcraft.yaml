name: tensorrt-libs # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '11.0.0.114-1+cuda13.2' # just for humans, typically '1.2+git' or '1.3.2'
summary: TensorRT and cuda runtime libraries # 79 char long summary
description: |
  This snap contains the TensorRT runtime libraries contained in the deb
  packages libnvinfer-bin and libnvinfer-samples from nvidia's repositories
  as well as the cuda libraries contained in the cuda-12-6 package and its
  dependencies.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

package-repositories:
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/som
    architectures: [arm64]
  - type: apt
    components: [main]
    suites: [r39.2]
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    key-server: https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
    url: https://repo.download.nvidia.com/jetson/common
    architectures: [arm64]

parts:
  tensorrt-libs:
    plugin: nil
    build-packages:
      - wget
    stage-packages:
      - cuda-13-2
    #   - tensorrt=11.0.0.114-1+cuda13.2
    override-stage: |
      wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
      dpkg -i cuda-keyring_1.1-1_all.deb

      apt update
      TENSORRT_VERSION=11.0.0.114-1+cuda13.2
      apt install --download-only -y tensorrt=$TENSORRT_VERSION \
                                     libnvinfer11=$TENSORRT_VERSION \
                                     libnvinfer-plugin11=$TENSORRT_VERSION \
                                     libnvinfer-vc-plugin11=$TENSORRT_VERSION \
                                     libnvinfer-lean11=$TENSORRT_VERSION \
                                     libnvinfer-dispatch11=$TENSORRT_VERSION \
                                     libnvonnxparsers11=$TENSORRT_VERSION \
                                     libnvinfer-bin=$TENSORRT_VERSION \
                                     libnvinfer-dev=$TENSORRT_VERSION \
                                     libnvinfer-lean-dev=$TENSORRT_VERSION \
                                     libnvinfer-plugin-dev=$TENSORRT_VERSION \
                                     libnvinfer-vc-plugin-dev=$TENSORRT_VERSION \
                                     libnvinfer-dispatch-dev=$TENSORRT_VERSION \
                                     libnvonnxparsers-dev=$TENSORRT_VERSION \
                                     python3-libnvinfer-dev=$TENSORRT_VERSION \
                                     libnvinfer-headers-python-plugin-dev=$TENSORRT_VERSION \
                                     libnvinfer-headers-dev=$TENSORRT_VERSION \
                                     libnvinfer-safe-headers-dev=$TENSORRT_VERSION \
                                     libnvinfer-headers-plugin-dev=$TENSORRT_VERSION \
                                     python3-libnvinfer=$TENSORRT_VERSION \
                                     python3-libnvinfer-lean=$TENSORRT_VERSION \
                                     python3-libnvinfer-dispatch=$TENSORRT_VERSION

      for f in /var/cache/apt/archives/*.deb; do
        dpkg -x $f $CRAFT_PART_INSTALL/ 
      done
      craftctl default

  scripts:
    plugin: dump
    source: scripts

slots:
  tensorrt-libs-cuda-13:
    interface: content
    read:
      - /
